name: Build dsh-pet iOS tweak (rootless arm64e)

# iPhone 12 = A14 = arm64e 新 ABI。SpringBoard 是系统二进制，Linux/WSL2
# 无法原生产出新 arm64e ABI，故本工程用 macOS runner 云端编译。
# 产物：rootless .deb（/var/jb），可直接装到 Dopamine / palera1n rootless。

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'tweak/**'
      - '.github/workflows/build-tweak.yml'

env:
  THEOS_PACKAGE_SCHEME: rootless
  # iPhone 12 需要 arm64e；同时保留 arm64 提高兼容性
  ARCHS: 'arm64 arm64e'

jobs:
  build:
    runs-on: macos-14          # arm64 macOS，Xcode clang 原生产出 arm64e 新 ABI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install iOS SDK (16.5, rootless needs iOS 15+)
        run: |
          cd $HOME
          curl -L -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          mkdir -p "$THEOS/sdks"
          cp -r sdks-master/iPhoneOS16.5.sdk "$THEOS/sdks/"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/UIKit.framework/UIKit.tbd"

      - name: Prepare animation assets
        run: |
          # 优先使用仓库内已转码素材（layout/.../dsh-pet/）。
          # 若为空，则从 npm 拉取 dsh-pet 并用 ffmpeg 转码首版 8 个动画。
          DEST="tweak/layout/Library/Application Support/dsh-pet"
          mkdir -p "$DEST"
          if [ -z "$(ls -A "$DEST" 2>/dev/null)" ]; then
            echo "::warning::layout 素材为空，尝试在线转码（需 ffmpeg + VP9 alpha 解码）"
            npm pack dsh-pet@0.4.9 --silent
            tar -xzf dsh-pet-0.4.9.tgz
            brew install ffmpeg >/dev/null 2>&1 || true
            SRC_DIR="$PWD/package/assets/webm" OUT_ROOT="$PWD/$DEST" bash tools/transcode-webm/transcode.sh 待机呼吸休闲 东张西望 被鼠标拖拽悬空反馈 点击回应-开心跃动 点击回应-害羞惊讶 点击回应-傲娇生气 点击回应-挠痒咯咯笑 点击回应-元气挥手
          fi
          echo "素材目录内容："; ls -1 "$DEST"

      - name: Build tweak (rootless, arm64 + arm64e)
        working-directory: tweak
        run: |
          make clean
          THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64 arm64e" TARGET="iphone:clang:16.5:15.0" make package

      - name: Verify package
        run: |
          DEB=$(ls tweak/packages/*.deb | head -1)
          echo "DEB=$DEB"
          dpkg-deb -I "$DEB" | grep -E 'Package|Version|Architecture'
          echo "--- 包内路径（rootless 应含 /var/jb；二进制含 arm64e slice 由 lipo 验证）---"
          dpkg-deb -c "$DEB" | head -20

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dshpet-rootless-arm64e
          path: tweak/packages/*.deb
          if-no-files-found: error
