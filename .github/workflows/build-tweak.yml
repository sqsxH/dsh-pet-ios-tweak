name: Build dsh-pet iOS tweak (rootless arm64)

# The account cannot allocate macOS runners (macos-14/macos-latest jobs are
# cancelled instantly with 0 steps; ubuntu runners work). So build on Linux
# with Theos cross-compilation. Output: arm64 dylib, loadable by arm64e
# SpringBoard (arm64e processes accept arm64 tweaks; new arm64e ABI needs
# Apple clang which is unavailable on Linux). rootless layout under /var/jb.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'tweak/**'
      - '.github/workflows/build-tweak.yml'

env:
  THEOS_PACKAGE_SCHEME: rootless

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos + iOS SDK + toolchain + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl unzip python3 dpkg-dev ffmpeg file xz-utils libtinfo6
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          # iOS SDK
          curl -L -o /tmp/sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q /tmp/sdks.zip -d /tmp
          mkdir -p "$HOME/theos/sdks"
          cp -r /tmp/sdks-master/iPhoneOS16.5.sdk "$HOME/theos/sdks/"
          test -f "$HOME/theos/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/UIKit.framework/UIKit.tbd"
          echo "SDK ready"
          # Theos iOS toolchain is NOT part of the git repo; download the
          # official non-Swift cross toolchain (L1ghtmann/llvm-project release).
          mkdir -p "$HOME/theos/toolchain"
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C "$HOME/theos/toolchain/"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/clang"
          "$HOME/theos/toolchain/linux/iphone/bin/clang" --version | head -1
          echo "Toolchain ready"

      - name: Prepare animation assets
        run: |
          DEST="tweak/layout/Library/Application Support/dsh-pet"
          mkdir -p "$DEST"
          COUNT=$(find "$DEST" -mindepth 1 -type d 2>/dev/null | wc -l)
          if [ "$COUNT" -lt 8 ]; then
            echo "::warning::assets missing, transcoding from npm dsh-pet@0.4.9"
            npm pack dsh-pet@0.4.9 --silent
            tar -xzf dsh-pet-0.4.9.tgz
            SRC_DIR="$PWD/package/assets/webm" OUT_ROOT="$PWD/$DEST" bash tools/transcode-webm/transcode.sh 待机呼吸休闲 东张西望 被鼠标拖拽悬空反馈 点击回应-开心跃动 点击回应-害羞惊讶 点击回应-傲娇生气 点击回应-挠痒咯咯笑 点击回应-元气挥手
          fi
          echo "assets tree:"; find "$DEST" -maxdepth 2 -type d | head -20

      - name: Build tweak (rootless, arm64)
        working-directory: tweak
        run: |
          make clean || true
          # ensure the filter plist exists at stage time (make clean used to delete it)
          cp -f com.yourid.dshpet.plist dshpet.plist
          THEOS_PACKAGE_SCHEME=rootless TARGET="iphone:clang:16.5:15.0" make package

      - name: Verify package
        run: |
          DEB=$(ls tweak/packages/*.deb | head -1)
          echo "DEB=$DEB"
          dpkg-deb -I "$DEB" | grep -E 'Package|Version|Architecture'
          echo "--- payload paths (rootless: /var/jb) ---"
          dpkg-deb -c "$DEB" | head -30

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dshpet-rootless-arm64
          path: tweak/packages/*.deb
          if-no-files-found: error
